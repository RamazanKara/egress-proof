apiVersion: v1
kind: ServiceAccount
metadata:
  name: egress-proof
  namespace: egress-proof-demo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: egress-proof
  namespace: egress-proof-demo
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, create, delete]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: egress-proof
  namespace: egress-proof-demo
subjects:
  - kind: ServiceAccount
    name: egress-proof
    namespace: egress-proof-demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: egress-proof
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: egress-proof-identity
rules:
  - apiGroups: [""]
    resources: [namespaces]
    resourceNames: [kube-system]
    verbs: [get]
  - nonResourceURLs: [/version]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: egress-proof-identity
subjects:
  - kind: ServiceAccount
    name: egress-proof
    namespace: egress-proof-demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: egress-proof-identity
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: egress-proof-evidence
  namespace: egress-proof-demo
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: egress-proof
  namespace: egress-proof-demo
spec:
  schedule: "0 6 * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 600
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app: egress-proof
        spec:
          serviceAccountName: egress-proof
          restartPolicy: Never
          nodeSelector:
            kubernetes.io/os: linux
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            fsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: egress-proof
              image: ghcr.io/ramazankara/egress-proof:latest
              command: [/egress-proof]
              args:
                - --spec
                - /config/egress.yaml
                - --image
                - ghcr.io/ramazankara/egress-proof:latest
                - --out
                - /evidence/$(POD_NAME)
              env:
                - name: POD_NAME
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.name
              resources:
                requests: {cpu: 50m, memory: 64Mi}
                limits: {cpu: 200m, memory: 256Mi}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              volumeMounts:
                - name: config
                  mountPath: /config
                  readOnly: true
                - name: evidence
                  mountPath: /evidence
          volumes:
            - name: config
              configMap:
                name: egress-proof
            - name: evidence
              persistentVolumeClaim:
                claimName: egress-proof-evidence

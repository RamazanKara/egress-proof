name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

env:
  GOMAXPROCS: "2"
  GOFLAGS: -p=2

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Install linter
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
      - run: make lint test build
